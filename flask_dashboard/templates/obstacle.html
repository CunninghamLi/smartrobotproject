{% extends "base.html" %}
{% block title %}Obstacle Avoidance{% endblock %}

{% block content %}
<h1>Obstacle Avoidance Mode</h1>

<div class="card">
    <p>This sets mode to obstacle and starts the algorithm.</p>
    <button onclick="startObstacle()">Start Obstacle Avoidance</button>
    <button onclick="stopObstacle()">Stop Obstacle Avoidance</button>
</div>

<div class="card">
    <h3>Speed for Obstacle Avoidance</h3>
    <input id="speedSlider" type="range" min="0" max="100" value="35" oninput="updateSpeedLabel(this.value)">
    <p>Speed: <span id="speedVal">35</span>%</p>
    <button onclick="sendSpeed()">Send Speed</button>
</div>

<script>
function postJSON(url, body){
    return fetch(url, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(body)
    }).then(r => r.json());
}

function startObstacle(){
    postJSON("/api/mode", {mode:"obstacle"});
    postJSON("/api/startstop", {state:"on"});
}

function stopObstacle(){
    postJSON("/api/startstop", {state:"off"});
    postJSON("/api/mode", {mode:"manual"});
}

function updateSpeedLabel(v){
    document.getElementById("speedVal").innerText = v;
}

function sendSpeed(){
    const v = Number(document.getElementById("speedSlider").value);
    postJSON("/api/speed", {speed: v});
}
</script>
{% endblock %}
